# 쓰담연구실 홈페이지 설정 (GitHub Pages가 자동으로 읽어요)
title: SSDAM-LAB 쓰담연구실
lang: ko
timezone: Asia/Seoul
markdown: kramdown
permalink: /blog/:title/
collections:
  guide:
    output: true
    permalink: /guide/:name/
exclude:
  - README.md
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: guide
    values:
      layout: guide
