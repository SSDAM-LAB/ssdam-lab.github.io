# 쓰담연구실 홈페이지 설정 (GitHub Pages가 자동으로 읽어요)
title: SSDAM-LAB 쓰담연구실
lang: ko
timezone: Asia/Seoul
# 예약 공지: 날짜가 미래인 글도 미리 만들어 두고, 화면에서 그 시각이 되면 보여 줘요
future: true
markdown: kramdown
permalink: /blog/:title/
collections:
  notices:
    output: true
    permalink: /notice/:name/
  guide:
    output: true
    permalink: /guide/:name/
exclude:
  - README.md
defaults:
  - scope:
      path: ""
      type: notices
    values:
      layout: notice
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: guide
    values:
      layout: guide
