<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SSDAM-LAB 쓰담연구실</title>
<meta name="description" content="일상을 쓰담쓰담하는 작은 앱을 만드는 쓰담연구실. 담노트 DAM:NOTE와 개발 일지.">
<meta property="og:title" content="SSDAM-LAB 쓰담연구실">
<meta property="og:description" content="일상을 쓰담쓰담하는 작은 앱을 만드는 곳">
<meta property="og:type" content="website">
<meta name="theme-color" content="#245edb">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B0%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:13px/1.5 Tahoma,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#1a1a1a;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit}
a{color:#0b4fd1}

/* 바탕화면 */
#desk{position:fixed;inset:0 0 36px 0;overflow:hidden;
  background:
   radial-gradient(60px 26px at 18% 22%,#fff9 60%,transparent 62%),
   radial-gradient(90px 34px at 24% 20%,#fffb 60%,transparent 62%),
   radial-gradient(70px 26px at 72% 14%,#fff9 60%,transparent 62%),
   radial-gradient(110px 36px at 80% 16%,#fffa 60%,transparent 62%),
   radial-gradient(80px 28px at 58% 34%,#fff7 60%,transparent 62%),
   radial-gradient(120% 70% at 50% 120%,#f9c9db 0%,#f6d9e6 35%,transparent 70%),
   linear-gradient(#5aa2ef 0%,#8cc2f5 40%,#c9e3fa 72%,#f3dbe7 100%)}
#desk::after{content:"SSDAM-LAB";position:absolute;right:18px;bottom:10px;color:#fff;opacity:.75;font:italic 700 22px/1 Tahoma,sans-serif;letter-spacing:.5px;text-shadow:1px 1px 2px #0003;pointer-events:none}

.icons{position:absolute;left:10px;top:10px;bottom:10px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px 4px}
.ico .gw{position:relative;display:block}
.ico .sc{position:absolute;left:-2px;bottom:0;width:14px;height:14px;background:#fff;border:1px solid #777;border-radius:2px;font:700 10px/12px Tahoma,sans-serif;color:#1b4fd1;text-align:center}
.ico{display:flex;flex-direction:column;align-items:center;gap:3px;width:84px;padding:4px 2px;border:1px dotted transparent;background:none;cursor:default}
.ico .g{font-size:34px;line-height:40px;filter:drop-shadow(1px 2px 1px #0004)}
.ico .l{color:#fff;font-size:12px;line-height:1.3;text-align:center;text-shadow:1px 1px 1px #000a;padding:0 3px;word-break:keep-all}
.ico.on .l{background:#316ac5;text-shadow:none}
.ico.on .g{filter:drop-shadow(1px 2px 1px #0004) brightness(.82) sepia(.4) hue-rotate(180deg) saturate(2)}
.ico:focus-visible{border-color:#fff}

/* 창 */
.win{position:absolute;display:flex;flex-direction:column;background:#ece9d8;border:3px solid #0831d9;border-top:0;border-radius:8px 8px 0 0;box-shadow:2px 3px 10px #0005;min-width:260px;min-height:160px;max-width:100%;max-height:100%}
.win.off{border-color:#7b8fe3}
.tb{display:flex;align-items:center;gap:5px;height:30px;padding:0 4px 0 7px;border-radius:7px 7px 0 0;margin:0 -3px;color:#fff;cursor:default;touch-action:none;
  background:linear-gradient(#0997ff 0%,#0053ee 8%,#0050ee 40%,#0066ff 88%,#0066ff 93%,#005bff 95%,#003dd7 96%,#003dd7 100%)}
.win.off .tb{background:linear-gradient(#a3bdf5 0%,#7c9ce9 10%,#7b9be7 85%,#8aa6ea 100%)}
.tb .ti{font-size:14px}
.tb .tt{flex:1;font-weight:700;font-size:13px;text-shadow:1px 1px #0a1883;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:22px;height:22px;border:1px solid #fff;border-radius:3px;padding:0;display:grid;place-items:center;font:700 12px/1 Tahoma,sans-serif;color:#fff;
  background:linear-gradient(#5d97ff,#2265e8 60%,#1b4fd1)}
.tb button:hover{filter:brightness(1.15)}
.tb button.x{background:linear-gradient(#ee8a6b,#d9532c 60%,#c4401c)}
.win.off .tb button{opacity:.75}
.mb{display:flex;gap:2px;padding:1px 4px;border-bottom:1px solid #d5d2c2;font-size:12px}
.mb span{padding:1px 6px}
.mb span:hover{background:#316ac5;color:#fff}
.body{flex:1;overflow:auto;margin:4px;background:#fff;border:1px solid #7f9db9;user-select:text}
.sb{font-size:11.5px;color:#444;padding:2px 8px 3px;border-top:1px solid #fff;display:flex;justify-content:space-between}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0}
.win.max .tb{border-radius:0}
.win.min{display:none}

/* 탐색기 */
.addr{display:flex;align-items:center;gap:6px;padding:3px 6px;font-size:12px;border-bottom:1px solid #d5d2c2}
.addr .box{flex:1;background:#fff;border:1px solid #7f9db9;padding:1px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp{display:flex;min-height:100%}
.side{width:170px;flex:none;padding:10px;background:linear-gradient(#7ba2e7,#6375d6)}
.panel{background:#fff;border-radius:6px 6px 0 0;margin-bottom:10px;overflow:hidden;font-size:12px}
.panel b{display:block;padding:5px 9px;color:#215dc6;background:linear-gradient(90deg,#fff,#c6d3f7)}
.panel div{padding:7px 9px;background:#d6dff7;color:#215dc6;line-height:1.7}
.panel a{color:#215dc6;text-decoration:none;cursor:pointer;display:block}
.panel a:hover{text-decoration:underline}
.list{flex:1;padding:6px}
.row{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border:1px solid transparent;background:none;text-align:left;cursor:default;border-radius:2px}
.row:hover{border-color:#c6d3f7;background:#f1f5fe}
.row.on{background:#316ac5;color:#fff}
.row .g{font-size:24px;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:400;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:#777;font-size:11.5px}
.row.on .t small{color:#dfe8ff}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;background:#fde3ec;color:#a3285a;margin-left:4px}
.empty{padding:28px;text-align:center;color:#777}

/* 글(메모장) */
.post{padding:22px 26px 34px;max-width:720px;margin:0 auto;font-size:15px;line-height:1.85;color:#222}
.post h1{font-size:21px;margin:0 0 4px;line-height:1.4}
.post .meta{color:#888;font-size:12.5px;margin-bottom:20px;padding-bottom:12px;border-bottom:1px dashed #ccc}
.post h2{font-size:17px;margin:26px 0 8px;color:#0b3fa8}
.post h3{font-size:15.5px;margin:20px 0 6px}
.post img{max-width:100%;height:auto;border:1px solid #ddd;border-radius:4px}
.post blockquote{margin:14px 0;padding:8px 14px;background:#fff6d6;border:1px solid #f0d77a;border-radius:4px}
.post code{background:#f2f2f2;padding:1px 4px;border-radius:3px;font-size:.92em}
.post pre{background:#f6f6f6;padding:10px;overflow:auto;border:1px solid #e3e3e3}
.post ul,.post ol{padding-left:22px}
.post hr{border:0;border-top:1px dashed #ccc;margin:22px 0}
.post table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.post th,.post td{border:1px solid #cfd8ea;padding:6px 10px;text-align:left;vertical-align:top}
.post th{background:#e8eefb;color:#0b3fa8;font-weight:700}
.post ol li,.post ul li{margin:3px 0}

/* 사용 설명서 (도움말 센터) */
.help{display:flex;flex-direction:column;min-height:100%}
.hhead{display:flex;align-items:center;gap:12px;padding:10px 16px;color:#fff;background:linear-gradient(#3a7bd5,#2a5fb8);border-bottom:3px solid #f0a05a}
.hhead .g{font-size:30px}
.hhead b{display:block;font-size:16px;text-shadow:1px 1px #0a1883}
.hhead small{font-size:12px;color:#dfe8ff}
.hwrap{flex:1;display:flex;min-height:0}
.hnav{width:190px;flex:none;padding:10px 8px;background:#eef3fc;border-right:1px solid #c6d3f7}
.hnav button{display:flex;align-items:center;gap:8px;width:100%;padding:7px 9px;border:1px solid transparent;border-radius:3px;background:none;text-align:left;cursor:pointer;font-size:12.5px;color:#0a246a}
.hnav button:hover{background:#fff;border-color:#c6d3f7}
.hnav button.on{background:#316ac5;color:#fff}
.hnav button .g{font-size:16px;width:20px;text-align:center}
.hmain{flex:1;min-width:0}
.hmain .post{padding-top:18px}
.hpager{display:flex;justify-content:space-between;gap:8px;padding:0 26px 26px;max-width:720px;margin:0 auto}

/* 정보창(소개·담노트·의견함) */
.sheet{padding:18px 20px;font-size:13.5px;line-height:1.75;user-select:text}
.sheet h2{font-size:16px;margin:0 0 2px}
.sheet .hd{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.sheet .hd .g{font-size:46px;line-height:1}
.sheet .sub{color:#666;font-size:12.5px}
.sheet fieldset{border:1px solid #d0d0bf;border-radius:4px;margin:12px 0;padding:8px 12px 10px}
.sheet legend{color:#0046d5;padding:0 4px;font-size:12.5px}
.sheet ul{margin:4px 0;padding-left:18px}
.xbtn{display:inline-flex;align-items:center;gap:6px;min-width:84px;justify-content:center;padding:4px 14px;border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#ecebe6 86%,#d6d0c5);color:#000;text-decoration:none;cursor:pointer;font-size:12.5px}
.xbtn:hover{box-shadow:inset 0 0 0 2px #f8b636}
.xbtn:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* 작업 표시줄 */
#bar{position:fixed;left:0;right:0;bottom:0;height:36px;display:flex;align-items:center;gap:4px;padding-bottom:env(safe-area-inset-bottom);z-index:9000;
  background:linear-gradient(#1f2f86 0%,#3168d5 3%,#4993e6 6%,#2157d7 10%,#2663e0 85%,#1941a5 100%)}
#start{height:36px;padding:0 20px 0 10px;border:0;border-radius:0 14px 14px 0;color:#fff;font:italic 700 17px/1 Tahoma,sans-serif;text-shadow:1px 1px 2px #0006;display:flex;align-items:center;gap:6px;cursor:pointer;
  background:linear-gradient(#388e3c 0%,#3c9f3c 6%,#5fbf4f 14%,#3da63a 40%,#2f8f2f 85%,#1f6f1f 100%);box-shadow:inset -2px 0 3px #0003}
#start:hover,#start.on{filter:brightness(1.1)}
#tasks{flex:1;display:flex;gap:4px;min-width:0;overflow:hidden;padding-left:4px}
.task{flex:0 1 170px;min-width:0;height:28px;padding:0 8px;border:1px solid #1c3fa8;border-radius:3px;color:#fff;display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;
  background:linear-gradient(#5b9bf4,#3b7ee8 50%,#2c6be0)}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.on{background:linear-gradient(#1e4fc2,#2558cc);box-shadow:inset 1px 1px 3px #0006}
#tray{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;color:#fff;font-size:12px;border-left:1px solid #0d3aa8;
  background:linear-gradient(#0c59b9 0%,#139ee9 6%,#18b5f2 10%,#139beb 14%,#1290e8 80%,#0d8dea 100%)}

/* 공지사항 게시판 */
.bd{width:100%;border-collapse:collapse;font-size:13px}
.bd th{background:linear-gradient(#fff,#ebeadb);border-bottom:2px solid #d6d2c2;border-right:1px solid #e2dfd2;padding:5px 8px;font-weight:400;text-align:left;color:#333;position:sticky;top:0}
.bd td{padding:8px;border-bottom:1px solid #eee;cursor:pointer}
.bd tr:hover td{background:#f1f5fe}
.bd .n{width:56px;text-align:center;color:#888}
.bd .d{width:96px;color:#888;font-size:12px;white-space:nowrap}
.bd tr.pin td{background:#fffbe6}
.bd tr.pin:hover td{background:#fff3c4}
.bd .pinb{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;background:#d9532c;color:#fff}
.bd .new{display:inline-block;font-size:10px;padding:0 5px;border-radius:7px;background:#e0628f;color:#fff;margin-left:6px;vertical-align:1px}
.ntool{display:flex;align-items:center;gap:8px;padding:4px 8px;border-bottom:1px solid #d5d2c2;font-size:12px}

/* 알림 풍선 */
#balloon{position:fixed;right:10px;bottom:46px;width:300px;z-index:9050;background:#ffffe1;border:1px solid #000;border-radius:8px;padding:10px 12px 12px;box-shadow:2px 3px 8px #0004;font-size:12.5px;display:none}
#balloon.on{display:block}
#balloon::after{content:"";position:absolute;right:40px;bottom:-10px;border:10px solid transparent;border-bottom:0;border-top-color:#000}
#balloon::before{content:"";position:absolute;right:41px;bottom:-8px;border:9px solid transparent;border-bottom:0;border-top-color:#ffffe1;z-index:1}
#balloon b{display:flex;align-items:center;gap:6px;font-size:13px;margin-bottom:4px}
#balloon .bx{position:absolute;right:6px;top:6px;width:18px;height:18px;border:1px solid #999;border-radius:3px;background:#fff;font-size:10px;line-height:1;cursor:pointer;padding:0}
#balloon .btns{margin-top:10px}

/* 설치 안내 */
.dtabs{display:flex;gap:4px;margin:6px 0 0;border-bottom:1px solid #919b9c}
.dtabs button{white-space:nowrap;padding:4px 12px;border:1px solid #919b9c;border-bottom:0;border-radius:4px 4px 0 0;background:linear-gradient(#fff,#ecebe6);cursor:pointer;font-size:12.5px;margin-bottom:-1px}
.dtabs button.on{background:#fff;border-top:2px solid #f8b636;font-weight:700}
.dpane{border:1px solid #919b9c;border-top:0;padding:12px 14px;background:#fff}
.dpane ol{margin:0;padding-left:20px}
.dpane li{margin:4px 0}
.warn{margin-top:10px;padding:8px 10px;background:#fff6d6;border:1px solid #f0d77a;border-radius:4px;font-size:12.5px}
.here{font-size:11px;color:#a3285a;background:#fde3ec;border-radius:8px;padding:0 6px;margin-left:4px;font-weight:400}

/* 시작 메뉴 */
#menu{position:fixed;left:0;bottom:36px;width:330px;max-width:100vw;z-index:9100;border:2px solid #1c4ec0;border-radius:8px 8px 0 0;overflow:hidden;box-shadow:3px -2px 10px #0005;display:none}
#menu.on{display:block}
#menu .top{display:flex;align-items:center;gap:10px;padding:8px 10px;color:#fff;font:700 15px Tahoma,sans-serif;text-shadow:1px 1px 2px #0007;background:linear-gradient(#1868ce,#0e60cb 30%,#2a77d8)}
#menu .top .av{width:42px;height:42px;border:2px solid #fff;border-radius:4px;background:#fde3ec;display:grid;place-items:center;font-size:26px}
#menu .cols{display:flex;border-top:2px solid #f0a05a}
#menu .l{flex:1;background:#fff;padding:6px 0}
#menu .r{width:140px;background:#d3e5fa;border-left:1px solid #95bdee;padding:6px 0}
#menu .it{display:flex;align-items:center;gap:8px;width:100%;padding:5px 10px;border:0;background:none;text-align:left;cursor:pointer;font-size:12.5px}
#menu .it .g{font-size:22px;width:26px;text-align:center}
#menu .it b{display:block;font-size:12.5px}
#menu .it small{color:#777;font-size:11px}
#menu .r .it{color:#0a246a;font-size:12px}
#menu .r .it .g{font-size:18px}
#menu .it:hover{background:#316ac5;color:#fff}
#menu .it:hover small{color:#dfe8ff}
#menu .bot{display:flex;justify-content:flex-end;gap:10px;padding:6px 10px;background:linear-gradient(#4282d6,#3b77d0 50%,#2d63bf)}
#menu .bot button{border:0;background:none;color:#fff;display:flex;align-items:center;gap:5px;cursor:pointer;font-size:12px}
#menu .bot i{display:grid;place-items:center;width:22px;height:22px;border-radius:4px;border:1px solid #fff;font-style:normal;font-size:12px}
#menu .bot .off i{background:#d9532c}
#menu .bot .lo i{background:#e5a118}

/* 부팅·종료 화면 */
.screen{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#fff;text-align:center}
#boot{background:#000;cursor:pointer}
#boot .logo{font:italic 700 34px/1 Tahoma,sans-serif;letter-spacing:1px}
#boot .logo em{font-style:normal;color:#f58fb4}
#boot .sm{font-size:12px;color:#aaa;font-style:normal;letter-spacing:0}
.prog{width:150px;height:18px;border:2px solid #b2b2b2;border-radius:4px;padding:2px;overflow:hidden;position:relative}
.prog i{position:absolute;top:2px;width:30px;height:10px;display:flex;gap:2px;animation:slide 1.2s linear infinite}
.prog i b{flex:1;border-radius:1px;background:linear-gradient(#2838c7,#3c78ff 50%,#2838c7)}
@keyframes slide{from{left:-34px}to{left:150px}}
#bye{background:#5a7edc;display:none}
#bye.on{display:flex}
#bye p{margin:0;font-size:16px}
@media (prefers-reduced-motion:reduce){.prog i{animation:none;left:60px}}

/* 휴대폰 */
@media (max-width:700px){
  .icons{display:grid;grid-template-columns:repeat(3,84px);gap:12px 8px;left:50%;transform:translateX(-50%);top:18px;bottom:auto}
  .win{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border-width:0}
  .tb{margin:0;border-radius:0;height:36px}
  .tb button{width:28px;height:28px}
  .tb .mx{display:none}
  .side{display:none}
  .hwrap{flex-direction:column}
  .hnav{width:auto;display:flex;gap:4px;overflow-x:auto;border-right:0;border-bottom:1px solid #c6d3f7;padding:6px}
  .hnav button{width:auto;flex:none;white-space:nowrap}
  .hhead{padding:8px 12px}
  .hpager{padding:0 18px 22px}
  .mb{display:none}
  .post{padding:18px 18px 30px;font-size:15.5px}
  .task{flex-basis:110px}
  #desk::after{font-size:17px}
  #balloon{left:8px;right:8px;width:auto}
  .bd .n{width:40px}
  .bd .d{width:78px}
  .dtabs button{padding:4px 8px;font-size:12px}
}
</style>
</head>
<body>

<div id="boot" class="screen" role="status" aria-label="불러오는 중">
  <div class="logo"><em>🐰</em> SSDAM-LAB<br><span class="sm">쓰담연구실</span></div>
  <div class="prog" aria-hidden="true"><i><b></b><b></b><b></b></i></div>
</div>

<main id="desk" aria-label="쓰담연구실 바탕화면">
  <div class="icons" id="icons"></div>
</main>

<div id="menu" role="menu" aria-label="쓰담 메뉴">
  <div class="top"><div class="av">🐰</div>SSDAM-LAB</div>
  <div class="cols">
    <div class="l" id="menuL"></div>
    <div class="r" id="menuR"></div>
  </div>
  <div class="bot">
    <button class="lo" id="mlo" type="button"><i>↻</i>새로 고침</button>
    <button class="off" id="moff" type="button"><i>⏻</i>끄기</button>
  </div>
</div>

<nav id="bar" aria-label="작업 표시줄">
  <button id="start" type="button" aria-haspopup="menu" aria-expanded="false"><span style="font-style:normal">🐰</span>쓰담</button>
  <div id="tasks"></div>
  <div id="tray"><span aria-hidden="true">🔈</span><span id="clock"></span></div>
</nav>

<div id="balloon" role="status" aria-live="polite">
  <button class="bx" type="button" aria-label="알림 닫기">✕</button>
  <b id="bTitle">🐰 담노트를 써 보세요</b>
  <div id="bText">로그인 없이 바로 쓰는 템플릿 메모장이에요. 설치하면 앱처럼 쓸 수 있어요.</div>
  <div class="btns" id="bBtns"><button class="xbtn" type="button" id="bGo">📒 바로 쓰기</button><button class="xbtn" type="button" id="bIns">📲 설치 방법</button></div>
</div>

<div id="bye" class="screen">
  <p>이제 창을 닫아도 안전합니다 🐰</p>
  <button class="xbtn" id="rebootBtn" type="button">다시 켜기</button>

    const tool = h('div', { class: 'ntool' });
    o = openWin({ id: 'notice', hash: '#/notice', title: '공지사항 - 쓰담연구실 게시판', icon: '📢', w: 640, h: 460,
      body: h('div', { style: 'flex:1;display:flex;flex-direction:column;min-height:0' }, tool, area),
      status: h('span', null, `글 ${list.length}개`) });
    o.area = area; o.tool = tool;
    o.showList = () => {
      o.tool.replaceChildren(h('span', null, '📢 쓰담연구실 공지사항'));
      const pinned = list.filter(n => n.pin), rest = list.filter(n => !n.pin);
      const tbody = h('tbody');
      const row = (n, num) => {
        const tr = h('tr', { class: n.pin ? 'pin' : '', tabindex: '0' },
          h('td', { class: 'n' }, n.pin ? h('span', { class: 'pinb' }, '공지') : String(num)),
          h('td', null, (n.pin ? '📌 ' : '') + n.title, isRecent(n.date) ? h('span', { class: 'new' }, 'N') : null),
          h('td', { class: 'd' }, fmtDate(n.date)));
        tr.addEventListener('click', () => o.showOne(n.slug));
        tr.addEventListener('keydown', e => { if (e.key === 'Enter') o.showOne(n.slug); });
        return tr;
      };
      pinned.forEach(n => tbody.append(row(n)));
      rest.forEach((n, i) => tbody.append(row(n, rest.length - i)));
      o.area.replaceChildren(list.length
        ? h('table', { class: 'bd' }, h('thead', null, h('tr', null, h('th', { class: 'n' }, '번호'), h('th', null, '제목'), h('th', { class: 'd' }, '날짜'))), tbody)
        : h('div', { class: 'empty' }, '아직 공지가 없어요'));
      o.area.scrollTop = 0;
      o.hash = '#/notice'; if (location.hash !== o.hash) history.replaceState(null, '', o.hash);
    };
    o.showOne = s => {
      const n = list.find(x => x.slug === s);
      if (!n) return o.showList();
      const back = h('button', { class: 'xbtn', type: 'button', style: 'min-width:0;padding:1px 10px;font-size:11.5px', onclick: () => o.showList() }, '◀ 목록');
      o.tool.replaceChildren(back, h('span', { style: 'color:#666' }, fmtDate(n.date)));
      const art = h('article', { class: 'post' }, h('h1', null, (n.pin ? '📌 ' : '') + n.title), h('div', { class: 'meta' }, fmtDate(n.date), ' · 쓰담연구실'), h('div', { html: n.html || '' }));
      art.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
      o.area.replaceChildren(art); o.area.scrollTop = 0;
      o.hash = '#/notice/' + encodeURIComponent(n.slug); if (location.hash !== o.hash) history.replaceState(null, '', o.hash);
    };
  } else focusWin(o);
  if (list[0]) local.set('ssdam:seenNotice', list[0].slug);
  if ($('#bTitle').textContent.startsWith('📢')) $('#balloon').classList.remove('on');
  slug ? o.showOne(slug) : o.showList();
}

/* ---------- 사용 설명서 ---------- */
let GUIDE = null;
async function loadGuide() {
  if (GUIDE) return GUIDE;
  try { const r = await fetch('guide.json', { cache: 'no-cache' }); const j = await r.json(); GUIDE = Array.isArray(j) ? j.filter(g => g && g.slug) : []; }
  catch { GUIDE = []; }
  return GUIDE;
}
async function openGuide(slug) {
  const pages = await loadGuide();
  let o = WINS.get('guide');
  if (!o) {
    const nav = h('nav', { class: 'hnav', 'aria-label': '설명서 목차' });
    const main = h('div', { class: 'hmain' });
    o = openWin({ id: 'guide', hash: '#/guide', title: '담노트 사용 설명서 - 도움말 및 지원', icon: '❓', w: 820, h: 560, menu: false,
      body: h('div', { class: 'body', style: 'margin-top:0' }, h('div', { class: 'help' },
        h('div', { class: 'hhead' }, h('span', { class: 'g', 'aria-hidden': 'true' }, '❓'), h('div', null, h('b', null, '도움말 및 지원 센터'), h('small', null, '담노트 DAM:NOTE 사용 설명서'))),
        h('div', { class: 'hwrap' }, nav, main))),
      status: h('span', null, '궁금한 게 더 있으면 의견함으로 물어봐 주세요') });
    o.nav = nav; o.main = main;
    for (const g of pages) {
      const b = h('button', { type: 'button', 'data-s': g.slug, onclick: () => o.show(g.slug) }, h('span', { class: 'g', 'aria-hidden': 'true' }, g.icon || '📄'), h('span', null, g.title));
      nav.append(b);
    }
    o.show = s => {
      const i = Math.max(0, pages.findIndex(g => g.slug === s));
      const g = pages[i];
      o.nav.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.s === (g && g.slug)));
      if (!g) { o.main.replaceChildren(h('div', { class: 'empty' }, '설명서를 불러오지 못했어요')); return; }
      const art = h('article', { class: 'post' }, h('h1', null, (g.icon ? g.icon + ' ' : '') + g.title), h('div', { html: g.html || '' }));
      art.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
      const prev = pages[i - 1], next = pages[i + 1];
      const pager = h('div', { class: 'hpager' },
        prev ? h('button', { class: 'xbtn', type: 'button', onclick: () => o.show(prev.slug) }, '◀ ' + prev.title) : h('span'),
        next ? h('button', { class: 'xbtn', type: 'button', onclick: () => o.show(next.slug) }, next.title + ' ▶') : h('span'));
      o.main.replaceChildren(art, pager);
      o.main.closest('.body').scrollTop = 0;
      o.hash = '#/guide/' + encodeURIComponent(g.slug);
      if (location.hash !== o.hash) history.replaceState(null, '', o.hash);
      const on = o.nav.querySelector('button.on'); if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    };
  } else focusWin(o);
  o.show(slug || (pages[0] && pages[0].slug));
}

async function openPost(slug) {
  const posts = await loadPosts();
  const p = posts.find(x => x.slug === slug);
  if (!p) { openDevlog(); return; }
  const id = 'post:' + slug;
  const art = h('article', { class: 'post' },
    h('h1', null, p.title || p.slug),
    h('div', { class: 'meta' }, fmtDate(p.date), ...(p.tags || []).map(x => h('span', { class: 'tag' }, x))),
    h('div', { html: p.html || '' }));
  art.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  const copyBtn = h('button', { class: 'xbtn', type: 'button', style: 'min-width:0;padding:1px 10px;font-size:11.5px' }, '🔗 링크 복사');
  copyBtn.addEventListener('click', async () => {
    const url = location.origin + (p.url || location.pathname);
    try { await navigator.clipboard.writeText(url); copyBtn.textContent = '✔ 복사했어요'; }
    catch { prompt('이 주소를 복사하세요', url); }
    setTimeout(() => { copyBtn.textContent = '🔗 링크 복사'; }, 1800);
  });
  openWin({ id, hash: '#/post/' + encodeURIComponent(slug), title: (p.title || slug) + '.txt - 메모장', icon: '📝', w: 700, h: 520,
    body: h('div', { class: 'body' }, art),
    status: h('span', { style: 'display:flex;gap:10px;align-items:center;width:100%;justify-content:space-between' }, h('span', null, fmtDate(p.date)), copyBtn) });
}

/* ---------- 바탕화면 아이콘 ---------- */
function buildIcons() {
  const box = $('#icons');
  for (const key of ['go', 'install', 'notice', 'guide', 'about', 'devlog', 'feedback', 'trash']) {
    const a = APPS[key];
    const b = h('button', { type: 'button', class: 'ico', 'aria-label': a.label + ' 열기' }, h('span', { class: 'gw' }, h('span', { class: 'g', 'aria-hidden': 'true' }, a.icon), a.shortcut ? h('span', { class: 'sc', 'aria-hidden': 'true' }, '↗') : null), h('span', { class: 'l' }, a.label));
    b.addEventListener('click', e => {
      e.stopPropagation();
      box.querySelectorAll('.ico.on').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      if (coarse || isPhone()) a.open();
    });
    b.addEventListener('dblclick', () => a.open());
    b.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); a.open(); } });
    box.append(b);
  }
  $('#desk').addEventListener('pointerdown', e => { if (e.target.id === 'desk') { box.querySelectorAll('.ico.on').forEach(x => x.classList.remove('on')); focusWin(null); } });
}

/* ---------- 시작 메뉴 ---------- */
function buildMenu() {
  const L = $('#menuL'), R = $('#menuR');
  const item = (g, title, sub, fn) => h('button', { type: 'button', class: 'it', role: 'menuitem', onclick: () => { toggleMenu(false); fn(); } }, h('span', { class: 'g', 'aria-hidden': 'true' }, g), h('span', null, h('b', null, title), sub ? h('small', null, sub) : null));
  L.append(
    item('📒', '담노트 바로 쓰기', '새 탭에서 열기', APPS.go.open),
    item('📲', '담노트 설치하기', 'PC · 안드로이드 · 아이폰', () => openInstall()),
    item('ℹ️', '담노트 정보', '어떤 앱인지 보기', openDamnote),
    item('📢', '공지사항', '꼭 알아야 할 소식', () => openNotice()),
    item('❓', '사용 설명서', '담노트 쓰는 법', () => openGuide()),
    item('📁', '개발 일지', '업데이트·만드는 이야기', () => openDevlog()),
    item('💌', '의견함', '의견 보내기', openFeedback));
  R.append(
    item('🐰', '쓰담연구실 소개', null, openAbout),
    item('🗑️', '휴지통', null, openTrash),
    item('🌐', 'GitHub', null, () => window.open(SITE.github, '_blank', 'noopener')));
  $('#start').addEventListener('click', e => { e.stopPropagation(); toggleMenu(); });
  document.addEventListener('pointerdown', e => { if (!e.target.closest('#menu,#start')) toggleMenu(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleMenu(false); });
  $('#mlo').addEventListener('click', () => location.reload());
  $('#moff').addEventListener('click', () => { toggleMenu(false); $('#bye').classList.add('on'); });
  $('#rebootBtn').addEventListener('click', () => { $('#bye').classList.remove('on'); });
}
function toggleMenu(force) {
  const m = $('#menu'), on = force == null ? !m.classList.contains('on') : force;
  m.classList.toggle('on', on); $('#start').classList.toggle('on', on); $('#start').setAttribute('aria-expanded', on);
}

/* ---------- 시계 ---------- */
function tick() {
  const d = new Date(), hh = d.getHours(), mm = String(d.getMinutes()).padStart(2, '0');
  $('#clock').textContent = `${hh < 12 ? '오전' : '오후'} ${hh % 12 || 12}:${mm}`;
}

/* ---------- 주소(#) 따라 창 열기 ---------- */
function route() {
  const m = /^#\/(\w+)(?:\/(.+))?$/.exec(location.hash);
  if (!m) return;
  const [, k, arg] = m;
  if (k === 'post' && arg) openPost(decodeURIComponent(arg));
  else if (k === 'guide') openGuide(arg ? decodeURIComponent(arg) : undefined);
  else if (k === 'notice') openNotice(arg ? decodeURIComponent(arg) : undefined);
  else if (APPS[k]) APPS[k].open();
}

/* ---------- 시작 ---------- */
buildIcons(); buildMenu(); tick(); setInterval(tick, 15000);
loadPosts();
const boot = $('#boot');
const balloon = $('#balloon');
const hideBalloon = () => { balloon.classList.remove('on'); store.set('ssdam:balloon', '1'); };
balloon.querySelector('.bx').addEventListener('click', hideBalloon);
$('#bGo').addEventListener('click', () => { hideBalloon(); APPS.go.open(); });
$('#bIns').addEventListener('click', () => { hideBalloon(); openInstall(); });
const showBalloon = async () => {
  const ns = await loadNotices();
  const top = ns[0];
  if (top && local.get('ssdam:seenNotice') !== top.slug && !location.hash.startsWith('#/notice')) {
    $('#bTitle').textContent = '📢 새 공지가 있어요';
    $('#bText').textContent = top.title;
    $('#bBtns').replaceChildren(h('button', { class: 'xbtn', type: 'button', onclick: () => { balloon.classList.remove('on'); openNotice(top.slug); } }, '📢 읽어 보기'));
    setTimeout(() => balloon.classList.add('on'), 600);
    return;
  }
  if (!store.get('ssdam:balloon')) setTimeout(() => balloon.classList.add('on'), 600);
};
const endBoot = () => { if (!boot.isConnected) return; boot.remove(); store.set('ssdam:booted', '1'); route(); if (!location.hash && !isPhone()) openAbout(); showBalloon(); };
if (store.get('ssdam:booted') || matchMedia('(prefers-reduced-motion:reduce)').matches) endBoot();
else { boot.addEventListener('click', endBoot); setTimeout(endBoot, 1800); }
addEventListener('hashchange', route);
</script>
